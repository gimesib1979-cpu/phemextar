<style>
:root{--bg:#f7f4ef;--card:#ffffff;--ink:#2a2724;--mut:#8b847b;--line:#ebe6de;--acc:#2a2724;--acc2:#efe9e0;
--t1:#e6efe8;--t2:#f6e9dc;--t3:#f3e3e6;--t4:#e3ebf3;--t5:#efeadf;
--red:#b5483f;--redbg:#f8e4e1;--amb:#9a6a1c;--ambbg:#f8efd9;--grn:#3f7a57;--grnbg:#e4f0e8}
@media (prefers-color-scheme:dark){html:not([data-mode=light]){--bg:#191817;--card:#232120;--ink:#eeebe6;--mut:#9a948c;--line:#33302d;--acc:#eeebe6;--acc2:#2e2b28;
--t1:#22302a;--t2:#33291f;--t3:#33252a;--t4:#212b35;--t5:#2c2a24;--red:#f08f86;--redbg:#3a2321;--amb:#e8bd6c;--ambbg:#352c1b;--grn:#86cfa2;--grnbg:#1f3127}}
html[data-mode=dark]{--bg:#191817;--card:#232120;--ink:#eeebe6;--mut:#9a948c;--line:#33302d;--acc:#eeebe6;--acc2:#2e2b28;
--t1:#22302a;--t2:#33291f;--t3:#33252a;--t4:#212b35;--t5:#2c2a24;--red:#f08f86;--redbg:#3a2321;--amb:#e8bd6c;--ambbg:#352c1b;--grn:#86cfa2;--grnbg:#1f3127}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--bf,Nunito),Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
header h1 svg{width:30px;height:30px}
#status{font-size:12px;color:var(--mut)}
main{padding:4px 14px 12px;max-width:720px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.span2{grid-column:span 2}
.card,.tile{background:var(--card);border-radius:var(--rad,22px);padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.grid .tile{margin:0}
.tile.c1{background:var(--t1)}.tile.c2{background:var(--t2)}.tile.c3{background:var(--t3)}.tile.c4{background:var(--t4)}.tile.c5{background:var(--t5)}
button.tile{font:inherit;color:var(--ink);text-align:left;border:0;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:84px;font-weight:700}
button.tile .big{font-size:26px;line-height:1;font-weight:400}
.card h2,.tile h2{font-size:12px;margin:0 0 8px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.hero{display:flex;align-items:center;gap:14px;min-height:96px}
.hero svg{width:64px;height:64px;flex:none}
.hero .d{font-size:13px;color:var(--mut)}.hero .g{font-size:20px;font-weight:800}
.paw{position:absolute;right:-6px;bottom:-8px;width:70px;height:70px;opacity:.07;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.tile .row{border-color:rgba(0,0,0,.06)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--mut)}
.done .t{text-decoration:line-through;color:var(--mut)}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.in{color:var(--grn)}.out{color:var(--red)}
.warn{border-radius:16px;padding:11px 14px;margin-bottom:8px;font-size:14.5px;font-weight:600;display:flex;gap:8px}
.w-red{background:var(--redbg);color:var(--red)}.w-amb{background:var(--ambbg);color:var(--amb)}.w-ok{background:var(--grnbg);color:var(--grn);align-items:center}
.w-ok svg{width:28px;height:28px;flex:none}
button{font:inherit;border:0;border-radius:14px;padding:11px 16px;background:var(--acc);color:var(--bg);font-weight:700;cursor:pointer}
button.sec{background:var(--acc2);color:var(--ink)}
button.ghost{background:transparent;color:var(--mut);padding:6px 8px;font-weight:400}
button.ghost svg{width:18px;height:18px;display:block}
button.del{background:transparent;color:var(--red);padding:6px 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chk{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--mut);background:transparent;padding:0;flex:none;color:var(--bg);font-size:14px;line-height:1}
.chk.on{background:var(--ink);border-color:var(--ink)}
.stat .l{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:19px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .stat{background:var(--bg);border-radius:16px;padding:10px}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
nav{position:fixed;bottom:10px;left:10px;right:10px;max-width:700px;margin:0 auto;background:var(--card);border-radius:24px;display:flex;z-index:6;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:18px;padding:7px 2px 5px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.act{color:var(--ink);background:var(--acc2)}
.fab{position:fixed;right:18px;bottom:92px;width:56px;height:56px;border-radius:20px;font-size:28px;font-weight:400;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6}
.ov{position:fixed;inset:0;background:rgba(20,18,16,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px 28px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-weight:800}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:0;border-radius:14px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--ink)}
input[type=checkbox]{width:auto;transform:scale(1.4);margin:4px 6px;accent-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{background:var(--card);color:var(--ink);padding:8px 13px;font-weight:700;white-space:nowrap;border-radius:14px}
.seg button.act{background:var(--ink);color:var(--bg)}
.empty{color:var(--mut);font-size:14px;padding:4px 0;display:flex;align-items:center;gap:12px}
.empty svg{width:76px;height:40px;flex:none;color:var(--mut);opacity:.7}
.pill{font-size:11px;border-radius:8px;padding:2px 7px;background:var(--acc2);color:var(--ink);font-weight:700}
.pill.hi{background:var(--redbg);color:var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:160px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:30;display:none;max-width:90%}
.help h4{margin:14px 0 4px}
.help ol,.help ul{padding-left:20px;margin:4px 0}
.help a{color:var(--ink);font-weight:700}
.remcat{display:flex;justify-content:center;margin-bottom:6px}.remcat svg{width:84px;height:84px}
[data-theme=mono]{--t1:#ecebe8;--t2:#e2e1dd;--t3:#f2f1ee;--t4:#e7e6e2;--t5:#efeeeb}
@media (prefers-color-scheme:dark){html[data-theme=mono]:not([data-mode=light]){--t1:#262626;--t2:#2c2c2c;--t3:#232323;--t4:#303030;--t5:#292929}}
html[data-theme=mono][data-mode=dark]{--t1:#262626;--t2:#2c2c2c;--t3:#232323;--t4:#303030;--t5:#292929}
[data-theme=levendula]{--t1:#ebe6f5;--t2:#f3e6ef;--t3:#e6eaf6;--t4:#efe8f3;--t5:#f1edf6}

html[data-theme=levendula][data-mode=dark]{--t1:#2a2535;--t2:#33262f;--t3:#252a37;--t4:#2d2733;--t5:#2c2933}
[data-theme=tenger]{--t1:#dff0f0;--t2:#e3ecf6;--t3:#e8f3ec;--t4:#e0eaf0;--t5:#edf3f3}
@media (prefers-color-scheme:dark){html[data-theme=tenger]:not([data-mode=light]){--t1:#1d3131;--t2:#1f2a36;--t3:#1f3027;--t4:#1e2a31;--t5:#253030}}
html[data-theme=tenger][data-mode=dark]{--t1:#1d3131;--t2:#1f2a36;--t3:#1f3027;--t4:#1e2a31;--t5:#253030}
[data-theme=barack]{--t1:#fbe6d8;--t2:#f8e0dc;--t3:#f6ecd6;--t4:#fae9e0;--t5:#f5ebe3}
@media (prefers-color-scheme:dark){html[data-theme=barack]:not([data-mode=light]){--t1:#3a2a20;--t2:#3a2624;--t3:#352d1d;--t4:#382a24;--t5:#322a24}}
html[data-theme=barack][data-mode=dark]{--t1:#3a2a20;--t2:#3a2624;--t3:#352d1d;--t4:#382a24;--t5:#322a24}
[data-theme=mono]{--grn:#2a2724;--red:#2a2724}
@media (prefers-color-scheme:dark){html[data-theme=mono]:not([data-mode=light]){--grn:#eeebe6;--red:#eeebe6}}
html[data-theme=mono][data-mode=dark]{--grn:#eeebe6;--red:#eeebe6}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.themes button{background:var(--bg);color:var(--ink);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;border:2px solid transparent}
.themes button.act{border-color:var(--ink)}
.sw{display:flex;gap:4px}.sw i{width:18px;height:18px;border-radius:6px;display:block}
nav button{font-size:10px;padding:7px 1px 5px}
.wo-top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-weight:700}
.wo-cat{display:flex;justify-content:center}.wo-cat svg{width:70px;height:70px}
.wo h3{text-align:center;font-size:22px;margin:6px 0 2px}
.wo #woD{text-align:center;min-height:40px;margin:4px 0 8px}
.wo-c{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.wo .btns{justify-content:center;margin-top:14px}
.wo #woNext{text-align:center;margin:10px 0 0}
details summary{cursor:pointer;color:var(--mut);font-size:14px;font-weight:700;margin-top:8px}
.exl{margin:6px 0 0;padding-left:20px;font-size:14px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;background:var(--bg);border-radius:14px;padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.links a span{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.napi p{margin:6px 0}
.ev{display:flex;gap:10px;padding:6px 0}.ev b{min-width:44px;font-variant-numeric:tabular-nums}
.sun{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.sun div{background:var(--bg);border-radius:14px;padding:9px 11px}
.sun .l{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sun .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sun svg{width:16px;height:16px;vertical-align:-2px;margin-right:4px}
.wx-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wx-h .pl{font-size:20px;font-weight:800}

/* kabalák */
.masc .ear{transform-box:fill-box;animation:earw 3.4s ease-in-out infinite}
.masc .earL{transform-origin:100% 100%}.masc .earR{transform-origin:0 100%;animation-delay:.35s}
@keyframes earw{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-14deg)}90%{transform:rotate(9deg)}}
.masc .zz{animation:zz 2.6s ease-in-out infinite}.masc .zz2{animation-delay:1.3s}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(4px,-6px)}}
.masc .dig{transform-box:fill-box;transform-origin:50% 0;animation:dig 1.4s ease-in-out infinite}
@keyframes dig{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
.masc .wag{transform-box:fill-box;transform-origin:50% 100%;animation:wagg 2.2s ease-in-out infinite}
@keyframes wagg{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.dz{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dz button{background:var(--bg);color:var(--ink);border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;font-weight:700;font-size:13px}
.dz button.act{border-color:var(--ink)}
.dz button svg{width:42px;height:42px}
.dz .sw{gap:3px}.dz .sw i{width:12px;height:12px;border-radius:4px}
/* animált torna-figura */
.wo-fig{display:flex;justify-content:center;height:170px}
.fig{width:150px;height:170px;color:var(--ink)}
.fig *{transform-box:view-box}
.fig .legL,.fig .legR{transform-origin:50px 66px}
.fig .armL,.fig .armR{transform-origin:50px 36px}
.fig .body{transform-origin:50px 66px}
.fig .head{transform-origin:50px 31px}
.fig .all{transform-origin:50px 108px}
.fig .legs{transform-origin:50px 108px}
.fig .wall{display:none}
@keyframes swA{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes swB{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes tilt{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes sway{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
@keyframes twistk{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
@keyframes sqB{50%{transform:translateY(22px)}}
@keyframes sqL{50%{transform:scaleY(.62)}}
@keyframes pushk{0%,100%{transform:rotate(14deg)}50%{transform:rotate(26deg)}}
@keyframes calfk{50%{transform:translateY(-8px)}}
@keyframes sidek{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes upL{0%,100%{transform:rotate(0)}50%{transform:rotate(148deg)}}
@keyframes upR{0%,100%{transform:rotate(0)}50%{transform:rotate(-148deg)}}
@keyframes breathk{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes archk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-1)}}
@keyframes nodk{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
@keyframes bridgek{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes foldk{0%,100%{transform:rotate(0)}50%{transform:rotate(48deg)}}
.f-march .legL,.f-march .armR{animation:swA 1s ease-in-out infinite}.f-march .legR,.f-march .armL{animation:swB 1s ease-in-out infinite}
.f-circles .armL{animation:spin 1.8s linear infinite}.f-circles .armR{animation:spinR 1.8s linear infinite}
.f-neck .head{animation:tilt 2.6s ease-in-out infinite}
.f-hips .body{animation:sway 1.8s ease-in-out infinite}
.f-twist .armL{transform:rotate(58deg)}.f-twist .armR{transform:rotate(-58deg)}.f-twist .body{animation:twistk 2s ease-in-out infinite}
.f-squat .body{animation:sqB 2.4s ease-in-out infinite}.f-squat .legs{animation:sqL 2.4s ease-in-out infinite}.f-squat .armL{transform:rotate(60deg)}.f-squat .armR{transform:rotate(-60deg)}
.f-push .wall{display:inline}.f-push .all{animation:pushk 2s ease-in-out infinite}.f-push .armR{transform:rotate(-70deg)}.f-push .armL{transform:rotate(-30deg)}
.f-calf .all{animation:calfk 1.3s ease-in-out infinite}
.f-side .armL{transform:rotate(148deg)}.f-side .armR{transform:rotate(-148deg)}.f-side .body{animation:sidek 2.6s ease-in-out infinite}
.f-stretch .armL{animation:upL 4s ease-in-out infinite}.f-stretch .armR{animation:upR 4s ease-in-out infinite}.f-stretch .body{animation:breathk 4s ease-in-out infinite}
.f-catcow .back{transform-origin:55px 58px;animation:archk 3.2s ease-in-out infinite}.f-catcow .head{transform-origin:24px 52px;animation:nodk 3.2s ease-in-out infinite}
.f-bridge .hipg{transform-origin:27px 94px;animation:bridgek 2.6s ease-in-out infinite}
.f-fold .body{transform-origin:40px 98px;animation:foldk 3.4s ease-in-out infinite}
/* hála, ébresztő, alvás */
.buddha{width:150px;height:150px;color:#b8862a}

.buddha .spark{animation:twinkle 2.5s ease-in-out infinite}.buddha .spark:nth-of-type(2n){animation-delay:1.2s}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.85;transform:scale(1.08)}}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:1}}

@media (prefers-color-scheme:dark){html:not([data-mode=light]) .gratov .sheet{background:linear-gradient(180deg,#2a2210,var(--card))}}
.alarmscr{position:fixed;inset:0;z-index:55;background:linear-gradient(160deg,#ff8a5c,#ff4fa0 50%,#7b5cff);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

.alarmscr input{max-width:220px;text-align:center;font-size:30px;font-weight:800;background:rgba(255,255,255,.95);color:#222}

.alarmscr button{background:#fff!important;color:#c0306a!important;margin-top:12px;font-size:18px;padding:12px 26px}
.nightscr{position:fixed;inset:0;z-index:54;background:#000;color:#ff9a6b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.nightscr .clk{font-size:84px;font-weight:700;font-family:var(--hf,Fredoka);opacity:.75;font-variant-numeric:tabular-nums}
.nightscr .sub{color:#8a5a45}
.nightscr button{background:transparent!important;color:#8a5a45!important;border:1px solid #4a2a1e}

.st-bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}

/* meglepi doboz, konfetti, buborék, víz */
.gift{display:flex;align-items:center;gap:14px;cursor:pointer}
.gift svg.box{width:74px;height:74px;flex:none;overflow:visible}
.gift .boxg{transform-box:fill-box;transform-origin:50% 100%;animation:giftw 2.8s ease-in-out infinite}
@keyframes giftw{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}85%{transform:rotate(-4deg)}90%{transform:rotate(0)}}
.gift.open .lid{transform-box:fill-box;transform-origin:0 100%;animation:lidpop .7s cubic-bezier(.2,1.4,.4,1) forwards}

.surp{animation:tileIn .6s .25s cubic-bezier(.2,.9,.3,1.25) both}

.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:conff linear forwards}

.bubble{position:fixed;left:12px;right:12px;bottom:96px;z-index:42;display:flex;align-items:flex-end;gap:8px;max-width:520px;margin:0 auto;animation:bubIn .55s cubic-bezier(.2,1.3,.4,1) both;pointer-events:auto}
.bubble.out{animation:bubOut .4s ease forwards}
@keyframes bubIn{from{transform:translateY(140%) scale(.8);opacity:0}}
@keyframes bubOut{to{transform:translateY(140%);opacity:0}}
.bubble>svg{width:62px;height:62px;flex:none;color:var(--ink);animation:bob 2s ease-in-out infinite}
.bubble .bt{background:var(--card);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);font-size:15px}

.petbtn{background:transparent!important;padding:0!important;border:0;color:inherit;flex:none}
.petbtn svg{width:64px;height:64px;display:block;animation:bob 4s ease-in-out infinite}
.petbtn.boing svg{animation:boing .6s ease}
@keyframes boing{30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15)}100%{transform:scale(1)}}
.badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

.brand.retro{font-family:'Racing Sans One','Fredoka',sans-serif!important;font-size:27px;font-style:italic;transform:skewX(-9deg);background:linear-gradient(180deg,#bff6ff 0%,#ffffff 42%,#2a1458 50%,#7b3cff 66%,#ff4fd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px rgba(40,10,70,.55);filter:drop-shadow(0 2px 0 #1d0b3a) drop-shadow(0 0 6px rgba(255,79,216,.55))}

@keyframes speed{0%,100%{transform:scaleX(.6);opacity:.6}50%{transform:scaleX(1);opacity:1}}

.pp-s{font-size:13px;color:var(--mut);min-height:18px;margin-top:2px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block;transition:background .15s}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.keys button{width:72px;height:72px;border-radius:50%;background:var(--card);color:var(--ink);font-size:26px;font-weight:700;padding:0}
.keys button:active{background:var(--acc2)}
.keys .kx{background:transparent;font-size:22px}
.keys .kx svg{width:30px;height:30px}
.pp-f{margin-top:14px;display:flex;justify-content:center;gap:10px}
.sheet .pp{margin:0 auto}
.reccode{font-size:28px;font-weight:800;letter-spacing:.15em;text-align:center;background:var(--bg);border-radius:14px;padding:14px;margin:12px 0}
.modes{display:flex;gap:6px;margin-top:10px}
.modes button{flex:1;background:var(--bg);color:var(--ink);padding:9px 6px;font-size:13px;border:2px solid transparent}
.modes button.act{border-color:var(--ink)}
/* boríték */
.mailov{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,18,16,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .3s ease;transition:opacity .5s}
.mailov.out{opacity:0}
@keyframes fadeIn{from{opacity:0}}
.env{position:relative;width:230px;height:150px;animation:envIn .8s cubic-bezier(.2,1.4,.4,1) both;perspective:600px}
@keyframes envIn{from{transform:translateY(-60vh) rotate(-25deg) scale(.6)}70%{transform:translateY(8px) rotate(4deg)}to{transform:none}}
.env-back{position:absolute;inset:0;background:#e3d3b8;border-radius:12px}
.letter{position:absolute;left:14px;right:14px;top:10px;height:128px;background:#fffdf8;border-radius:8px;z-index:2;padding:12px 12px 10px;color:#2a2724;box-shadow:0 2px 8px rgba(0,0,0,.12);animation:letterUp .7s 1.35s cubic-bezier(.2,.9,.3,1.2) both;text-align:left}
@keyframes letterUp{from{transform:translateY(0)}to{transform:translateY(-92px)}}
.letter .lf{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.letter .ls{font-size:13px;color:#6b645c;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.letter .stamp{position:absolute;right:8px;top:8px;width:26px;height:30px;border:2px dashed #c98b6a;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#c98b6a}
.letter .stamp svg{width:16px;height:16px}
.env-front{position:absolute;inset:0;background:#f1e6d2;border-radius:12px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.04)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;background:#e8d9c0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:4;animation:flap .55s .85s ease-in forwards;border-radius:12px 12px 0 0}
@keyframes flap{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}
.env-seal{position:absolute;left:50%;top:52%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#c4573f;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;animation:seal .3s .7s ease-in forwards}
.env-seal svg{width:14px;height:14px}
@keyframes seal{to{transform:scale(0);opacity:0}}
.mail-cap{margin-top:26px;background:var(--card);color:var(--ink);padding:8px 16px;border-radius:14px;font-weight:800;font-size:14px;animation:fadeIn .4s 1.6s both}
@media (prefers-reduced-motion:reduce){*,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

  settingsRef.onSnapshot(s=>{if(s.exists)Object.assign(S.settings,s.data());if(!S.settings.themeV2){S.settings.theme='vidam';S.settings.themeV2=true;saveSettings();return}render()});

 const dueT=S.tasks.filter(x=>!x.done&&x.due===t);
 if(dueT.length)w.push(['amb',`Ma esedékes: ${dueT.map(x=>x.title).join(', ')}`]);
 const remD=S.reminders.filter(x=>!x.done&&x.when&&x.when<=nowDT());
 if(remD.length)w.push(['red',`Lejárt emlékeztető: ${remD.map(x=>x.title).join(', ')}`]);
 const ds=daySpend(t);
 if(st.dailyLimit>0&&ds>st.dailyLimit)w.push(['red',`Mai költés ${ft(ds)} – túllépted a napi keretet (${ft(st.dailyLimit)})`]);
 else if(st.dailyLimit>0&&ds>st.dailyLimit*0.8)w.push(['amb',`Mai költés ${ft(ds)} – a napi keret 80%-a felett`]);
 const ms=monthSums(ym());
 if(st.monthlyLimit>0&&ms.o>st.monthlyLimit)w.push(['red',`Havi kiadás ${ft(ms.o)} – túllépted a havi keretet (${ft(st.monthlyLimit)})`]);
 else if(st.monthlyLimit>0&&ms.o>st.monthlyLimit*0.8)w.push(['amb',`Havi kiadás a keret ${Math.round(ms.o/st.monthlyLimit*100)}%-án áll`]);
 if(ms.o>ms.i&&ms.i>0)w.push(['amb',`E hónapban több a kiadás, mint a bevétel (${ft(ms.b)})`]);
 if(st.eveningCheck&&now.getHours()>=(st.eveningHour||19)&&!S.money.some(x=>x.date===t))w.push(['amb','Ma még nem rögzítettél pénzmozgást – írd be a napi költéseket!']);
 if(workoutDue())w.push(['amb','Még nem tornáztál ma reggel – csak 10 perc az egész!']);
 try{for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const k=ymd(d),c=clashesOn(k);if(c.length){w.push(['red',`⚠ Ütköző órák ${i===0?'ma':fmtDate(k)}: ${c.map(e=>e.start+' '+e.title).join(' / ')}`]);break}}}catch(_){}
 try{const ml=medLog(today());['reggel','este'].forEach(s=>{if(medsFor(s).length&&!ml[s]&&hm(new Date())>medDueTime(s))w.push(['red',`💊 ${s==='reggel'?'Reggeli':'Esti'} gyógyszer még nincs nyugtázva`])})}catch(_){}
 try{celebrations(2).forEach(c=>w.push([c.d===0?'red':'amb',`${c.p.type==='nevnap'?'🌸 Névnap':'🎂 Születésnap'}${c.d===0?' MA':c.d===1?' holnap':' 2 nap múlva'}: ${c.p.name}${c.age?' ('+c.age+'.)':''}${c.p.note?' – '+c.p.note:''}`]))}catch(_){}
 const nowM=now.getHours()*60+now.getMinutes();
 S.schedule.filter(x=>x.day===DAYS[dow()]&&x.start).forEach(x=>{const [h,m]=x.start.split(':').map(Number);const d=h*60+m-nowM;if(d>0&&d<=30)w.push(['amb',`${d} perc múlva: ${x.title}${x.place?' ('+x.place+')':''}`])});
 return w;
}

 for(let c=1;c<=10;c++){const u=sp.reduce((a,s,i)=>a+Math.min(s,c)*sr[i],0),rows=Math.ceil(u/c),cw=(W-gap*(c-1))/c,ch=(H-gap*(rows-1))/rows;if(ch<34&&c<10)continue;const sc=Math.min(cw,ch*1.3)-(rows*c-u)*2;if(!best||sc>best.s)best={s:sc,c,rows}}

 <h4 id="s1">1. Első lépések</h4><ol><li>Alul válaszd ki a fület (Ma, Órarend, Teendők, Pénz, Emlék., Több).</li><li>A jobb alsó <b>＋</b> gombbal új tételt adsz az aktuális fülhöz.</li><li>Bármelyik tételnél a ceruza gombbal szerkesztesz vagy törölsz.</li><li>A jobb felső sarokban látod, hová mentődik: ● mentve = a Claude-fiókodba (minden eszközön látod), ○ = csak ezen a telefonon.</li></ol>
 <h4 id="s2">2. Órarend</h4><ol><li>Nyisd meg az Órarend fület, felül válaszd ki a napot.</li><li>＋ → add meg a napot, kezdést, véget, megnevezést, helyszínt → Mentés.</li><li>A pont (•) jelzi, melyik napon van bejegyzés. A Ma fülön a mai órák jelennek meg, 30 perccel kezdés előtt figyelmeztetést kapsz.</li></ol>

 <h4 id="s4">4. Pénz</h4><ol><li>A Ma fülön a <b>− Kiadás</b> / <b>+ Bevétel</b> gombbal gyorsan rögzítesz.</li><li>Add meg az összeget és kategóriát (pl. Élelmiszer, Üzemanyag, Vállalkozás).</li><li>A Pénz fülön hónapot választhatsz, látod az egyenleget és a kategóriánkénti bontást.</li></ol>
 <h4 id="s5">5. Emlékeztetők</h4><ol><li>＋ → szöveg, időpont, ismétlés (Nincs / Naponta / Hetente / Havonta).</li><li>Ha nyitva van az app, időben felugró ablak és hang jelez; „Kész” vagy „10 perc múlva”.</li><li>Ismétlődőnél a „Kész” automatikusan a következő időpontra teszi.</li></ol>
 <h4 id="s6">6. Figyelmeztetések</h4><ul><li>lejárt / mai határidős teendő</li><li>lejárt emlékeztető</li><li>napi vagy havi keret 80%-a és túllépése</li><li>több a kiadás, mint a bevétel a hónapban</li><li>este, ha aznap nem rögzítettél költést</li><li>30 percen belül kezdődő óra</li></ul>

 <h4 id="s8">8. Telepítés a kezdőképernyőre</h4><ol><li>Nyisd meg ennek az oldalnak a linkjét a telefon böngészőjében.</li><li>Android (Chrome): ⋮ menü → <b>Hozzáadás a kezdőképernyőhöz</b>.</li><li>iPhone (Safari): Megosztás ikon → <b>Főképernyőhöz adás</b>.</li></ol>
 <h4 id="s9">9. Színtéma váltása</h4><ol><li>Menj a <b>Több</b> fülre.</li><li>A Megjelenés csempén koppints a kívánt témára (Vidám, Pasztell, Fekete-fehér, Levendula, Tenger, Barack).</li><li>Azonnal átvált és elmentődik – minden eszközödön ugyanaz lesz.</li></ol>
 <h4 id="s10">10. Reggeli torna</h4><ol><li>Beállítás fül → <b>Reggeli torna és horoszkóp</b> csempe → kapcsold be az emlékeztetőt, és állítsd be, <b>mikor jelezzen</b> → Mentés.</li><li>A beállított időpontban (ha nyitva van az app) felugrik a „Mozgás!” ablak: Indítás / 15 perc múlva / Ma kihagyom.</li><li>A Ma fülön az <b>Edzésterv</b> csempén az <b>Indítás</b> gomb végigvezet a gyakorlatokon: visszaszámlálás, hangjelzés váltáskor, Szünet és Következő gomb.</li><li>Két 10 perces program váltakozik naponta: „Ébresztő átmozgatás” és „Könnyű erősítés”.</li><li>A végén automatikusan „Kész” lesz, és nő a napos sorozatod.</li><li>Ha valamelyik gyakorlat fájdalmat okoz, hagyd ki.</li></ol>
 <h4 id="s11">11. Napi fül</h4><ol><li>Koppints alul a <b>Napi</b> (nap ikon) fülre.</li><li>Első alkalommal válaszd ki a csillagjegyed, és engedélyezd, hogy az app Claude-tól kérje a napi szövegeket.</li><li>Horoszkóp, névnap, „ezen a napon történt” és macskás érdekesség naponta frissül; az <b>Újragenerálás</b> gombbal újat kérhetsz.</li><li>A belföldi és külföldi hírek csempéin a gombok megnyitják a hírportálokat.</li></ol>
 <h4 id="s12">12. Időjárás: helyben és Senj</h4><ol><li>Napi fül → <b>Helyi időjárás</b> csempe → válaszd ki a településed (vagy Egyéb → név és koordináta). Később a Beállítás fülön módosíthatod.</li><li>Mindkét helyre (helyben és Senj) látod: napkelte, napnyugta, nappal hossza és változása, delelés, pirkadat, alkonyat, esti arany óra, holnapi napkelte, valamint, hogy mennyi idő van napkeltéig/napnyugtáig.</li><li>Alul a holdfázis és a megvilágítottság.</li><li>A hőmérséklet, eső, szél és több napos előrejelzés gombjai megnyitják az időjárás-oldalakat (Időkép, HungaroMet, Windy; Senjnél a horvát DHMZ, Windy bura/szél és hullám, HAK útinformáció).</li></ol>
 <h4 id="s13">13. Világos / sötét mód</h4><ol><li>Fejléc jobb felső gombja: koppintásonként Automatikus → Világos → Sötét.</li><li>Ugyanez a Beállítás fül <b>Megjelenés</b> csempéjén is beállítható.</li><li>Automatikusnál a telefon beállítását követi.</li></ol>
 <h4 id="s14">14. Védelem: PIN és ujjlenyomat</h4><ol><li>Beállítás fül → <b>Védelem</b> → <b>PIN beállítása</b> → add meg kétszer a 4 jegyű PIN-t.</li><li>Megkapod a <b>vészkódot</b> – írd fel! Ezzel tudod feloldani, ha elfelejted a PIN-t.</li><li>Alapból az app megnyitása és a pénz rész is védett lesz; a két jelölőnégyzettel külön ki-be kapcsolhatod.</li><li><b>Ujjlenyomat bekapcsolása</b>: ha a telefon ezen a felületen engedi, ezután a PIN-billentyűzeten az ujjlenyomat ikonnal is nyílik. Ha nem engedi, az app szól, és a PIN marad.</li><li>A pénzösszegek helyén „••••• Ft” látszik; a <b>Mutasd</b> gombbal oldod fel, az <b>Elrejt</b> gombbal rejted újra.</li><li>Ha 1 percnél tovább a háttérben van az app, újra zár.</li></ol>
 <h4 id="s15">15. Levél értesítés (boríték)</h4><ol><li>Új levélnél a képernyő közepére beesik egy boríték, kinyílik, kicsúszik a levél a feladóval és a tárggyal, és csilingel.</li><li>A fejlécben a boríték ikon megbillen, és piros szám mutatja az olvasatlanokat; koppintásra listát kapsz.</li><li>Kipróbálás: Beállítás fül → <b>Levél értesítés</b> → <b>Próba: új levél</b>.</li></ol>
 <h4 id="s16">16. Dizájnok és kabalák</h4><ol><li>Beállítás fül → <b>Megjelenés</b> → válassz a 10 dizájn közül: Vidám, Pasztell (macska), Kutyus, Vakond kert, Neon róka, Retró mackó, Cukor nyuszi, Panda minimal, Éji bagoly, Trópusi béka.</li><li>Minden dizájnnak saját színei, betűtípusa, formája és mozgó kabalája van (pislog, fület mozgat, alszik, ásít).</li><li>A világos/sötét mód mindegyiknél működik.</li></ol>
 <h4 id="s17">17. Napi ritmus</h4><ol><li>Beállítás fül → <b>Napi ritmus és ébresztő</b>: kapcsold be és állítsd be az időpontokat.</li><li><b>Hála</b> (alapból 9:23): megjelenik a Buddha, egy gondolat és egy mező, ahová beírhatod, miért vagy hálás. A bejegyzések a Napi fülön, a Hála naplóban látszanak.</li><li><b>Reggeli üzenet</b>: borítékban érkezik egy minden nap más, kedves üzenet.</li><li><b>Alvás</b> (alapból 22:00): az esti figyelmeztetés. Innen indíthatod az Alvó módot.</li><li><b>Mozgásszünet</b>: a megadott időszakban véletlen időpontokban egy 1 perces, animált gyakorlat.</li></ol>
 <h4 id="s18">18. Ébresztő fejszámolással, alvó mód</h4><ol><li>Kapcsold be az ébresztőt, add meg az időt, a napokat és a nehézséget.</li><li>Ébresztéskor addig szól, amíg két fejszámolós feladatot meg nem oldasz (pl. 6 × 4 × 8 = 192). Utána jön a reggeli üzenet.</li><li>Fontos: az app csak nyitott állapotban szól. Este indítsd az <b>Alvó módot</b>, és hagyd a telefont töltőn; ez sötét órát mutat és ébren tartja a képernyőt.</li><li>Biztonsági tartalék: a telefon saját óra appjában is állíts ébresztőt.</li></ol>
 <h4 id="s19">19. Képernyőidő</h4><ol><li>A Napi fülön látod, hány percet használtad ma ezt az appot, és az elmúlt 7 napot.</li><li>A telefon összes appjának idejét a telefon mutatja: Beállítások → Digitális jólét és szülői felügyelet.</li></ol>
 <h4 id="s20">20. Tanári órarend és iskolák</h4><ol><li>Órarend fül → <b>Iskolák</b> → ＋: név, cím, szín (pl. citromsárga), kapcsolattartó.</li><li><b>Tanítás</b> nézet → ＋: dátum, kezdés, vége, iskola (listából), osztály, tantárgy, terem, tananyag, számonkérés.</li><li>Az órák az iskola színével jelennek meg; ‹ › gombbal lapozol a hetek között.</li><li>A Ma fülön látod a mai órákat és a következő 14 nap számonkéréseit.</li></ol>
 <h4 id="s21">21. Órarend feltöltése Excelből</h4><ol><li>Órarend → Iskolák → <b>Sablon letöltése</b>.</li><li>Töltsd ki az <b>Iskolák</b> lapot, majd vagy az <b>Órák</b> lapot (minden óra egy sor, dátummal), vagy a <b>Heti minta</b> lapot (ismétlődő órák Ettől–Eddig, páros/páratlan hetekkel) + a <b>Szünetek</b> lapot.</li><li>Dátum: ÉÉÉÉ-HH-NN, idő: ÓÓ:PP. A fejléceket és a lapneveket ne írd át.</li><li>Órarend → Iskolák → <b>Feltöltés Excelből</b>. Ugyanazt az órát kétszer nem veszi fel.</li></ol>
 <h4 id="s22">22. Gmail-értesítés</h4><ol><li>Beállítás fül → <b>Levél értesítés · Gmail</b> → <b>Gmail bekapcsolása</b>, majd engedélyezd a felugró ablakban.</li><li>Ezután percenként megnézi az olvasatlan leveleket. Új levélnél leesik a boríték, és csilingel; a fejlécben a boríték ikon mutatja az olvasatlanok számát.</li><li>A boríték ikonra koppintva listát kapsz, a <b>Megnyitás a Gmailben</b> linkkel.</li><li>„Csak az Elsődleges levelek” bekapcsolva a reklámokra nem szól.</li><li>Csak nyitott appnál működik; zárt képernyőn a BlueMail értesít.</li></ol>
 <h4 id="s23">23. Napi meglepi, kedves üzenetek, vízivás</h4><ol><li><b>Napi meglepi</b>: a Ma fülön egy ajándékdoboz – koppints rá, kinyílik, konfetti, és jön a napi kihívás, vicc, fejtörő, érdekesség vagy bók.</li><li><b>Kedves üzenetek</b>: napközben véletlen időpontban a kabalád felugrik egy buborékkal.</li><li><b>Vízivás</b>: koppints a poharakra; ha lemaradsz, a kabala szól.</li><li><b>Simogatás</b>: koppints a kabalára a Ma fül tetején. 😊</li><li>Konfetti jár a kész teendőért, a tornáért és a hála-bejegyzésért. Beállítások: Beállítás fül → <b>Meglepetések és kedvesség</b>.</li></ol>
 <h4 id="s24">24. Widget nézet és indítás a telefonról</h4><ol><li>Beállítás fül → <b>Widget nézet</b>: egy képernyőn nagy óra, következő óra visszaszámlálással, napkelte/napnyugta, Gmail, teendők, vízivás, napi gondolat. Magától frissül.</li><li>Közvetlen link: az app linkje után <b>#widget</b> (pl. …/LibJ4zdZGhU6qbr56jiV4P#widget).</li><li>Kezdőképernyőre (Android, Chrome): nyisd meg a linket → ⋮ menü → <b>Hozzáadás a kezdőképernyőhöz</b>. Csináld meg a sima és a #widget linkkel is: két ikonod lesz.</li><li>Kilépés: <b>Teljes app</b> csempe.</li></ol>
 <h4 id="s25">25. Név és logó</h4><ol><li>Beállítás fül → <b>Név és logó</b>.</li><li>Az <b>Az app neve</b> mezőbe írd be a kívánt nevet (alapból: Phemextár) – a fejlécben és a zárolóképernyőn azonnal megjelenik.</li><li>Válassz logóstílust: Retró króm, Neon, Űr-futurisztikus, Arany vagy Egyszerű.</li></ol>
 <h4 id="s26">26. A Phemextár-csempe</h4><ol><li><b>Figyelem</b>: mozgó retró logó, lebegő nap és száguldó neonrács – minden fülön fent marad.</li><li><b>Érdeklődés</b>: a futó sor váltogatja a következő órát, a mai teendőket, emlékeztetőt, leveleket, napkeltét és a napi gondolatot.</li><li><b>Vágy</b>: a kör mutatja a nap %-át (torna, víz, hála, teendők), mellette a sorozat és a vízivás.</li><li><b>Cselekvés</b>: a <b>＋ Gyors</b> gombbal egy koppintással: kiadás, bevétel, teendő, tanóra, emlékeztető, hála, torna, víz.</li><li>Görgetéskor összecsukódik, hogy több hely maradjon.</li></ol>
 <h4 id="s27">27. Órarend: nap, hét, hónap nézet</h4><ol><li>Órarend fül felső gombjai: <b>Nap</b> (órás idővonal, piros vonal = most), <b>Hét</b> (hétfőtől vasárnapig 7 oszlop), <b>Hónap</b> (naptár), <b>Lista</b>, <b>Ismétlődő</b>, <b>Iskolák</b>.</li><li>A szombat és vasárnap mindig látszik, rózsaszínes háttérrel.</li><li>Lapozás: húzd az ujjad jobbra/balra (vagy ‹ ›), „Ugrás a mai napra” visszahoz. A hét vagy hónap egy napjára koppintva megnyílik annak napi nézete.</li><li>Egy órára koppintva szerkesztheted; a ＋ gomb a kiválasztott napra vesz fel órát.</li><li>Iskolánként megadhatsz hétköznapi és hétvégi alapidőt (pl. Focus: hétvégén 9:00–15:30, hétköznap 17:00–20:30) – új óránál az app ez alapján tölti ki az időt.</li><li>Az órák az iskola színével, az ismétlődő események szürkével, a határidős teendők és emlékeztetők a nap tetején jelennek meg.</li><li>Ha két óra egymásra esik, egymás mellé kerülnek piros szaggatott kerettel és „ütközés” jelöléssel, a Ma fülön pedig figyelmeztetés jelenik meg (7 napra előre).</li></ol>
 <h4 id="s28">28. Menü és kezelés egy kézzel</h4><ol><li>Alul öt nagy gomb: <b>Ma</b>, <b>Órarend</b>, középen a nagy <b>＋</b>, <b>Teendők</b>, <b>Több</b>.</li><li>A <b>＋</b> mindig azt veszi fel, ami az adott fülhöz illik (Órarendben tanórát a kiválasztott napra, Teendőknél teendőt, Pénznél tételt); a Ma fülön a gyors menüt nyitja.</li><li>A <b>Több</b> gomb alatt: Pénz, Emlékeztetők, Napi, Beállítás, Widget nézet, Gyors művelet.</li><li>A telefon saját gombjai fölé kerül a menü, nem takarják.</li></ol>
 <h4 id="s29">29. Adatok átvitele a telefonos appba</h4><ol><li>A telefonon nyisd meg a <b>webes</b> Phemextárt (a Claude appban vagy a linkkel).</li><li>Beállítás → <b>Adatok mentése és átvitele</b> → <b>Biztonsági mentés</b> → engedélyezd a letöltést. A fájl neve: phemextar-mentes-ÉÉÉÉ-HH-NN.json, a Letöltések mappába kerül.</li><li>Nyisd meg a <b>Phemextár Android-appot</b> → Beállítás → <b>Visszatöltés mentésből</b> → válaszd ki a fájlt → <b>Visszatöltés</b>.</li><li>Kész: minden adat megjelenik. Ugyanígy működik visszafelé is.</li></ol>
 <h4 id="s30">30. Ünnepek: születésnapok és névnapok</h4><ol><li>Több → <b>Ünnepek</b> (vagy a nagy ＋ az Ünnepek fülön, vagy Gyors művelet → 🎂/🌸).</li><li><b>Születésnap</b>: név, dátum, jegyzet (kicsoda). Ha az évszám megvan, kiírja, hányadik szülinap.</li><li><b>Névnap</b>: írd be a nevet – a keresztnév alapján az app kikeresi a magyar névnaptárból a dátumot (ha több is van, választhatsz, vagy megadhatod kézzel). Jegyzet: kicsoda.</li><li>2 nappal és 1 nappal előtte, valamint aznap: figyelmeztetés a Ma fülön, kedves buborék, a futó sorban és az Emlékeztetők fülön is megjelenik.</li><li>A naptárban a nap neve (névnap) mindig látszik: a Nap nézetben középen kiemelve, a heti és havi nézetben a dátum alatt.</li><li><b>Névnaptár</b> fül: keresés név szerint, és a következő 14 nap névnapjai.</li></ol>
 <h4 id="s31">31. Widget-csempék és animált időjárás</h4><ol><li>Widget nézet → <b>✎ Csempék</b> (vagy Beállítás → Megjelenés → Widget-csempék kiválasztása): pipáld be, mi jelenjen meg (óra, időjárás helyben és Senjben, következő óra, mai órarend, mai és holnapi teendők, emlékeztető, ünnepek, névnap, Gmail, víz, torna, költés, gondolat, meglepi, Hold, kabala).</li><li>Az időjárás-csempe élő jelenet: nappal süt a nap, éjjel hold és csillagok, felhők úsznak, esik az eső vagy a hó, villámlik – az aktuális időnek megfelelően.</li><li>Az Android-appban élő hőmérséklet, szél, esőesély és 4 napos előrejelzés is jön (Open-Meteo); a webes változatban a nap állása szerinti égbolt látszik.</li><li>A widget-nézetben minden kipipált csempe <b>egy képernyőre</b> kerül, görgetés nélkül, szabálytalan méretekben (kicsi, széles, magas, nagy); telefonon 2, tableten 3–4, gépen 6 oszlopban. Minél kevesebbet pipálsz, annál nagyobbak. Jobb alul: ✎ csempék, ⤢ teljes app.</li></ol>
 <h4 id="s32">32. Gyógyszerfigyelő</h4><ol><li>Több → <b>Egészség</b> → <b>Gyógyszer</b> fül → <b>+ Gyógyszer</b>: név, adag, mikor (reggel / este / mindkettő), megjegyzés.</li><li><b>Reggel</b>: ha aznap van ébresztő, ébresztés után 15 perccel, egyébként (és legkésőbb) 8:00-kor szól. <b>Este</b>: 20:00-kor. Mindkettő átállítható.</li><li>Teljes képernyős ablak jön, hangjelzéssel: <b>✅ Bevettem</b> vagy <b>❌ Most nem veszem be</b> – mindkettőt egy szorzással kell nyugtázni (pl. 6 × 4). Addig nem enged tovább.</li><li><b>⏰ Vedd be – szólj 10 perc múlva</b>: 10 perc múlva újra szól, és így tovább, amíg nem nyugtázod.</li><li>A <b>heti összesítőben</b> látszik, mikor vetted be (időponttal), mikor hagytad ki, és mikor nem nyugtáztad. A widgetre is kirakható.</li><li>Fontos: amíg nincs kész a 3. fázis, csak akkor szól, ha az app nyitva van.</li></ol>
 <h4 id="s33">33. Kalória, étkezés, heti értékelés</h4><ol><li>Több → <b>Egészség</b> → <b>Ma</b>: írd be, mit ettél/ittál, pl. „800 g kaukázusi kefir, 2 db sajtburger McDonald's, 2 kávé”.</li><li>Az app felismeri a mennyiséget (g, dkg, kg, dl, l, db, szelet, pohár, bögre, adag) és kiszámolja a becsült kalóriát. Amit nem ismer: a webes változatban Claude becsüli meg, az Android-appban kézzel adhatod meg (koppints a tételre).</li><li><b>Heti értékelés</b>: napi kalória-grafikon, átlag, zöldség/gyümölcs, gyorsétel, édesség, felvágott, kávé, alkohol, hal – az előző héthez képest (⬆⬇).</li><li><b>Egészségprofil</b>: jelöld be, ha van szív-érrendszeri betegség (pl. infarktus után), magas vérnyomás, cukorbetegség vagy magas koleszterin – a heti értékelés ezekre külön figyelmeztet.</li><li>Ez nem orvosi tanács: étrendről és gyógyszerről mindig az orvosod döntsön.</li></ol>
 <h4 id="s34">34. A Főoldal csempéi és a gyors költés</h4><ol><li>Indításkor a <b>Főoldal</b> jelenik meg: felül a Phemextár-csempe, alatta egy képernyőn minden, görgetés nélkül.</li><li>Csempék: köszöntő (figyelmeztetésekkel – koppints rá a teljes listáért), Mai órarend, Teendők, Emlékeztetők, Ma költöttél, Egészség, Ünnepek, Napi (időjárás), Torna, Napi meglepi, Pénz, Widget, Beállítás, kabala. Koppints egy csempére, és befelé lépsz.</li><li><b>Gyors költés</b>: a „Ma költöttél” csempe <b>＋</b> gombja → válassz kategóriát (tankolás, étel, bolti vásárlás, kávé, üdítő, vonatjegy, bérlet, busz, parkolás, autópálya, patika, rezsi, telefon, ruha, háztartás, ajándék, szórakozás, iskola, alapanyag, egyéb, fizetés) → összeg → Mentés. A megjegyzést később a Pénz csempén belül kiegészítheted.</li><li>Minden csempe egy koppintással nyílik; vissza a <b>‹ Főoldal</b> gombbal vagy a Phemextár logóra koppintva.</li></ol>
 <h4 id="s35">35. Buddha-mappa (titkos)</h4><ol><li>Főoldal → <b>Buddha</b> csempe. Első alkalommal válassz egy <b>külön, 4 jegyű titkos PIN-t</b> (kétszer kell beírni).</li><li>Két mappa van: <b>Még idén</b> és <b>2027</b>. Írj be egy-egy mondatot, Enter vagy ＋ – kipipálhatod, törölheted.</li><li>A tartalom AES-256 titkosítással tárolódik; a kulcsot csak a PIN-edből lehet előállítani. A PIN-t az app nem tárolja – <b>ha elfelejted, a tartalom nem állítható vissza</b>.</li><li>Amikor kilépsz a mappából, vagy az app a háttérbe kerül, a mappa azonnal lezárul. 5 hibás PIN után ideiglenesen zárol.</li><li>Titkos dolgokat ne a chatben írj le, hanem közvetlenül a mappába – csak ott vannak védve.</li></ol>
 <h4 id="s36">36. Karácsonyi ajándéklista</h4><ol><li>Főoldal → <b>Ajándéklista</b> csempe → <b>＋ Új</b>: kinek, mit, keret, ár, állapot, megjegyzés.</li><li>Állapotok: 💡 Ötlet → 🛍️ Megvéve → 🎁 Becsomagolva → ✅ Átadva. A <b>→</b> gombbal egy koppintással léptetheted.</li><li>Felül: hány nap van karácsonyig, hány ajándék kész, a keret és az elköltött összeg.</li></ol>
 <h4 id="s37">37. Értesítések zárt képernyőn (Android)</h4><ol><li>Első indításkor engedélyezd az értesítéseket (Engedélyezés).</li><li>Beállítás → <b>🔔 Értesítések zárt képernyőn</b>: itt látod, mi van beütemezve. Ha a „Pontos időzítés” ⚠️, nyomd meg a gombját, és kapcsold be a Phemextárnál.</li><li>Nyomd meg a <b>🔔 Teszt</b> gombot, zárd le a képernyőt – 15 mp múlva jönnie kell.</li><li>Mi szól: ébresztő (3–10 percenként ismétel, amíg meg nem nyitod), gyógyszer (10, 20, 40 perc múlva újra, amíg nem igazolod), hála, reggeli üzenet, torna, mozgásszünetek, alvás, emlékeztetők, ünnepek (2 és 1 nappal előtte és aznap 8:00).</li><li>A gyógyszernél és az emlékeztetőnél a <b>10 perc múlva</b> gombbal szundizhatsz.</li><li>Ha néha késik vagy elmarad: telefon Beállítások → Alkalmazások → Phemextár → Akkumulátor → <b>Korlátlan</b>.</li><li>A Buddha-mappa tartalma soha nem jelenik meg értesítésben.</li></ol>
 <h4 id="s38">38. Saját Főoldal és a Phemex mappa</h4><ol><li>Indításkor mindig a saját Főoldalad jelenik meg. Az utolsó csempe mindig a <b>📂 Phemex</b> mappa.</li><li>A Phemex mappában van az összes csempe. Koppintással megnyitod, a sarokban a <b>＋</b> kiteszi a Főoldalra, a <b>✓</b> leveszi. A szám mutatja a sorrendet a Főoldalon.</li><li>Gombok: <b>Alapállapot</b>, <b>Mindet ki</b>, <b>Főoldal ürítése</b>.</li><li>A csempék mérete automatikusan igazodik: kevés csempe = nagy csempék, sok csempe = kisebbek, és mindig kitöltik a képernyőt.</li></ol>
 <h4 id="s39">39. Tanítási órarend</h4><ol><li>Az Órarendben csak a tanítási órák vannak.</li><li>Egy óra adatai ebben a sorrendben: Iskola · Osztály · Szakma · Technikus/Szakmunkás · Dátum · Óra kezdete · Óra vége (a tantárgy nem kötelező).</li><li>Hétvégén az óra mindig 9:00–15:30, ha nem adsz meg időt.</li><li>Excelben ugyanez az oszlopsorrend az <b>Órarend</b> fülön és a <b>Heti minta</b> fülön.</li></ol>
 <h4 id="s40">40. Widget-szerkesztő és tablet</h4><ol><li>Phemex mappa → <b>▣ Widget</b> fül: a <b>＋</b> kiteszi, a <b>✓</b> leveszi a csempét a widgetről (információs csempék, rádió, appok is).</li><li><b>▣ Widget megnyitása</b>: egy képernyős háttér-nézet. A ✎ gombbal visszajutsz a szerkesztőbe.</li><li>Tableten: kapcsold be a <b>🔆 Képernyő ébren</b> pipát – widget módban nem alszik el a kijelző. Tartsd töltőn. Éjjel (alvásidő és reggel között) halványabb lesz.</li></ol>
 <h4 id="s41">41. Rádió és YouTube</h4><ol><li>Főoldal → <b>📻 Rádió</b>. Magyar és horvát adók, keresés név szerint; a ☆ csillaggal kedvencnek jelölöd.</li><li>A rádió tovább szól, ha másik részre lépsz vagy lezárod a képernyőt (amíg az appot be nem zárod).</li><li><b>▶️ YouTube</b> csempe: a telefonon a YouTube appot nyitja meg a saját fiókoddal, gépen a youtube.com-ot.</li><li>A böngészős (Claude-os) nézetben a rádiókereső nem érhető el, a telefonos és tabletes appban igen.</li></ol>
 <h4 id="s42">42. Telefon-panel: appok és vezérlők</h4><ol><li>Phemex mappa → <b>📱 Telefon appjai</b> → <b>Appok betöltése</b>. A <b>＋</b> bármelyik telepített appot (BlueMail, Üzenetek, MÁV, YouTube…) csempeként kiteszi a Főoldalra.</li><li>Telefon-vezérlő csempék: Wi-Fi, Mobilnet, Bluetooth, Hangerő, Kijelző, Akkumulátor, Telefon, Üzenetek, Kamera, Térkép, Óra, Beállítások.</li><li>Az új üzenetek számlálása (BlueMail-boríték) a Google Play Protect tiltása miatt kikerült – a Play Protect nem engedi telepíteni az olyan appot, amely más appok értesítéseit figyeli.</li></ol>
 <h4 id="s43">43. Gyógyszerek egyenként és eseti gyógyszer</h4><ol><li>Minden gyógyszernél kötelező a <b>név</b> és a <b>hatóanyag (mg)</b>.</li><li>Amikor szól, minden gyógyszert külön jelölsz: <b>✅ Igen</b> vagy <b>❌ Nem</b>. Ha mind meg van jelölve: <b>Kész – nyugtázom</b> + szorzás.</li><li>Ha mindet bevetted ✅, ha egyiket sem ❌, ha csak néhányat 🟡 jelenik meg a heti összesítőben. A Gyógyszer fülön látod egyenként, mikor mit jelöltél.</li><li><b>Eseti gyógyszer</b> (pl. fájdalomcsillapító): Főoldal → 💊＋ Eseti gyógyszer, vagy Egészség → Gyógyszer → ＋ Bevettem egyet. Csak a nevet és a mg-ot írod be, az időpontot az app rögzíti. Ez csak napi napló, nem emlékeztet.</li></ol>
 <h4 id="s44">44. Határidőnapló</h4><ol><li>Főoldal → <b>📒 Osztálynapló</b>. Az Órarendben szereplő osztályok (pl. 13.A) automatikusan megjelennek csempeként.</li><li>Koppints egy osztályra: dátum szerint látod az összes jegyzetet, amit az óráihoz írtál, és a következő óra időpontját.</li><li><b>📝 Új jegyzet</b>: írd be a szöveget, válaszd ki az órát (vagy hagyd a következő órát). Az Órarendben is van 📝 gomb minden óránál.</li><li>🔔 A következő óra előtti napon (alapból 18:00-kor) egyszer szól: „olvasd el a jegyzetet”.</li><li>⏳ Határidő: megadhatod, mikorra kell elkészítened – akkor is szól. Az „Elkészült” gombbal vagy a pipával zárod le; a nyitott határidők az Osztálynapló tetején listázódnak.</li><li>Az Excelben külön <b>Osztálynapló</b> fülön is megvan.</li></ol>
 <h4 id="s45">45. Csempekészítő – saját csempék</h4><ol><li>Főoldal → <b>✨ Csempekészítő</b> (vagy Phemex mappa → ✨ Új saját csempe).</li><li>Válaszd ki a fajtát: <b>📝 Jegyzet / lista</b>, <b>🔗 Link / weboldal</b>, <b>⏳ Visszaszámláló</b>, <b>➕ Számláló</b>.</li><li>Adj nevet, válassz ikont (vagy írj be bármilyen emojit) és színt – felül látod az előnézetet.</li><li><b>Létrehozás és kitétel</b>: rögtön megjelenik a Főoldalon. A Phemex mappában is ott van, onnan widgetre is kiteheted.</li><li>Szerkesztés és törlés: nyisd meg a csempét, majd ✎.</li></ol>
 <h4 id="s46">46. KRÉTA iskolánként és útvonalterv</h4><ol><li>Órarend → Iskolák → iskola szerkesztése: írd be a <b>Címet</b> és a <b>KRÉTA belépési címet</b> (amit a böngészőben a KRÉTA-belépésnél látsz, pl. klik012345001.e-kreta.hu).</li><li>Főoldal → <b>🎓 KRÉTA</b>: iskolánként egy <b>Belépés</b> gomb, plusz a KRÉTA app megnyitása.</li><li>Főoldal → <b>🧭 Útvonal</b>: a következő óra iskolájához útvonalterv tömegközlekedéssel, autóval vagy gyalog (Google Térkép), és minden iskolához külön is.</li><li><b>🚂 MÁV app megnyitása</b> a Phemextárból; ha nincs telepítve, a jegy.mav.hu nyílik meg.</li></ol>
 <h4 id="s47">47. Skinek</h4><ol><li>Fejléc → <b>🎨</b> gomb, vagy Főoldal → <b>🎨 Skinek</b>, vagy Beállítás → Megjelenés.</li><li>Skinek: <b>Virágos rajz</b>, <b>Cicás rajz</b>, <b>Gyerekrajz</b>, <b>Free vibe</b>, <b>Kannabisz</b>, <b>Jamaica</b>, <b>Tehénmintás</b> (retró zenelejátszó, zöld LCD), <b>Fémes</b> (15 választható neon színnel), <b>Minimál</b>, <b>Minimál éjjel</b>, <b>Rajzos</b>, <b>Csillagos éj</b>.</li><li>Fémesnél a neon színt a bemutatóban vagy a Beállítás → Megjelenés részben választod.</li><li>A bemutató az AIDA-modell szerint halad: <b>A</b> – nagy előnézet (lapozz ‹ › vagy húzd oldalra), <b>I</b> – mi benne a jó, <b>D</b> – 👀 Felpróbálom: 8 másodpercre az egész app átöltözik, <b>A</b> – ✨ Ezt kérem!</li><li>A Phemextár felirat minden skinben ugyanaz marad.</li></ol>
 <h4 id="s48">48. Excel központ – szerkesztés gépen</h4><ol><li>Főoldal → <b>📊 Excel</b>.</li><li>Telefonon <b>↓ Letöltés Excelbe</b> → megosztás → <b>Drive</b>.</li><li>Gépen drive.google.com → nyisd meg, szerkeszd, mentsd .xlsx-ként.</li><li>Telefonon vagy tableten <b>↑ Feltöltés Excelből</b> → válaszd a fájlt → nézd át → Betöltés.</li><li>Mindig a legnagyobb sorszámú fájllal dolgozz; a sorszám az eszközök között folytatódik.</li></ol>
 <h4 id="s49">49. Claude és ChatGPT csempe</h4><ol><li>Főoldal → <b>✳️ Claude</b> vagy <b>🤖 ChatGPT</b>. Írd be a kérdést.</li><li><b>↗ Küldés a fiókomba</b>: megnyílik a Claude / ChatGPT a saját fiókoddal, a kérdés ott is megjelenik és ott kapod a választ; az appban naplózódik.</li><li>Ha a válasz az appban kell: add meg a saját API-kulcsodat (🔑 rész) → megjelenik a <b>💬 Válasz itt</b> gomb. A kulcs csak azon az eszközön marad; az API-használat külön fizetős.</li></ol>
 <h4 id="s50">50. App-csempe a Csempekészítőben</h4><ol><li>✨ Csempekészítő → fajta: <b>📱 Telefon app</b> → <b>App kiválasztása a telefonról</b>.</li><li>Válassz bármelyik telepített appot vagy telefon-vezérlőt (Wi-Fi, Bluetooth, hangerő…). Az ikon és a szín az apphoz igazodik.</li><li>A csempe a Főoldalra kerül, és koppintásra az appot indítja – így rakhatod össze a saját telefonkezelő felületedet.</li></ol>
 <h4 id="s51">51. Szinkron és frissítés</h4><ol><li>Főoldal → <b>🔐 Szinkron</b>. Első eszközön: e-mail, jelszó, szinkron-jelszó → <b>Első eszköz: fiók létrehozása</b>. A többin ugyanezekkel → <b>Belépés</b>.</li><li>Ezután telefon, tablet és gép élőben ugyanazt látja. Minden adat a saját szinkron-jelszavaddal titkosítva megy fel (AES-256) – a felhő tulajdonosa sem tudja elolvasni.</li><li>A szinkron-jelszót sehol nem tároljuk; ha elfelejted, a felhőben lévő adat nem olvasható, de az eszközökön lévő megmarad.</li><li>Gépen a webes Phemextárt böngészőből nyitod meg (link a Szinkron oldalon).</li><li>Ha új verzió van, az app szól (🆕 csempe és ablak), és egy gombbal letöltheted.</li></ol>
 <h4 id="s52">52. Órarend-sablon (minden nap egy sor)</h4><ol><li>📊 Excel → <b>⬇️ Órarend-sablon letöltése</b>. Minden nap egy sor 2026.11.19-től 2027.12.31-ig, a dátum és a nap neve kitöltve.</li><li>Csak ott tölts ki sort, ahol órád van: <b>Intézmény</b> (legördülő), <b>Osztály</b>, <b>Tantárgy megnevezése</b>, <b>Időpont</b> (legördülő).</li><li>Időpont: <b>Hétköznap</b> = 17:00–20:00, <b>Hétvége</b> = 9:00–15:30, <b>Egyéni</b> = a Kezdés és Vége oszlopba írod.</li><li>Több alkalom egy napon: szúrj be egy új sort ugyanazzal a dátummal.</li><li>Feltöltés: 📊 Excel → ↑ Feltöltés Excelből → Betöltés. Az új iskolák automatikusan bekerülnek. Később kiegészítve újra feltöltheted.</li><li>A <b>🗑️ Teljes órarend törlése</b> gomb minden eszközről törli az órákat (az iskolák maradnak).</li><li>Az appban kézzel is felvehetsz órát: Órarend → ＋ Új → Időpont legördülő.</li></ol>
 <h4 id="s53">53. Phemextár mint kezdőképernyő</h4><ol><li>📂 Phemex → <b>📱 Telefon appjai</b> → <b>🏠 Beállítás kezdőképernyőnek</b>.</li><li>A megnyíló listában válaszd a <b>Phemextár</b>-t.</li><li>Ezután a telefon Kezdőképernyő gombja mindig a Főoldaladat hozza (vagy a widgetet, ha bepipálod).</li><li>Más appot a <b>📱 Összes app</b> csempéről vagy a saját app-csempéidről indítasz.</li><li>Visszaállítás: telefon Beállítások → Alkalmazások → Alapértelmezett alkalmazások → Kezdőképernyő → az eredeti (pl. One UI Home).</li></ol>
 <h4 id="s54">54. Google Naptár szinkron</h4><ol><li>Telefonon: <b>🔐 Szinkron</b> (vagy <b>📅 Google Naptár</b> csempe) → <b>📅 Bekapcsolás ezen a telefonon</b> → engedélyezd a naptár-hozzáférést.</li><li>Válaszd a Google-fiókod naptárát (a Gmail-címed).</li><li>Ezután minden óra, emlékeztető, határidő, teendő, születésnap és névnap automatikusan bekerül, és ha módosítasz vagy törölsz, a naptárban is frissül. Az emlékeztetők és határidők a naptárban is jeleznek.</li><li>Csak egy eszközön kapcsold be (a telefonon), különben duplán kerülnek be.</li><li>Fordítva is működik: a Google Naptárad bejegyzései (📅 jellel) megjelennek a Phemextár naptárában, napi nézetében és a Határidőnaplóban.</li></ol>

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('szs:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){let h=0;for(const c of 'szs:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
function bioId(){try{return localStorage.getItem('szs-bio')}catch(_){return null}}
async function tryBio(){const id=bioId();if(!id)return false;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});return true}catch(e){toast('Az ujjlenyomat most nem sikerült – használd a PIN-t');return false}}
async function setupBio(){
 try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Phemextar'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'sajat-szervezo',displayName:'Saját szervező'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  localStorage.setItem('szs-bio',b64(cred.rawId));toast('Ujjlenyomat bekapcsolva ezen a telefonon');render()}
 catch(e){toast('Ezen a felületen a telefon nem engedi az ujjlenyomatot – a PIN működik')}
}

 el.innerHTML=`<div class="pp"><div class="pp-cat">${M('n')}</div><div class="pp-t">${o.title}</div><div class="pp-s">${o.sub||''}</div><div class="dots"><i></i><i></i><i></i><i></i></div>

function chime(){try{if(!actx)return;const t0=actx.currentTime;[[1046.5,0],[1318.5,.16],[1568,.32],[2093,.5]].forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.18,t0+t+.02);g.gain.exponentialRampToValueAtTime(.001,t0+t+.6);o.start(t0+t);o.stop(t0+t+.65)})}catch(_){}try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(_){}}
function mailBadge(){const b=$('#mailBadge'),n=mails.filter(m=>!m.seen).length;b.textContent=n;b.classList.toggle('on',n>0)}
function showMail(m){
 mails.unshift(Object.assign({at:new Date(),seen:false},m));mailBadge();
 const btn=$('#mailBtn');btn.classList.remove('wig');void btn.offsetWidth;btn.classList.add('wig');
 envelope(m);
}

 const el=document.createElement('div');el.className='mailov';
 el.innerHTML=`<div class="env"><div class="env-back"></div><div class="letter"><div class="stamp">${PAW.replace('class="paw"','')}</div><div class="lf">${esc(m.from)}</div><div class="ls">${esc(m.subject)}</div></div><div class="env-front"></div><div class="env-flap"></div><div class="env-seal">${PAW.replace('class="paw"','')}</div></div><div class="mail-cap">${esc(cap||'Új levél érkezett')}</div>`;

 const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500)};
 el.onclick=close;setTimeout(close,m.long?11000:6500);
}
function openMails(){

function dayIdx(n){const d=new Date(today()+'T12:00:00');return Math.floor(d.getTime()/864e5)%n}
function inWindow(t,len){const n=new Date(),nm=n.getHours()*60+n.getMinutes(),m=minsOf(t);return nm>=m&&nm<m+(len||60)}
function showGratitude(){

 $('#ov').classList.add('gratov');
 try{if(actx){const t0=actx.currentTime;[[528,0],[792,.4]].forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.15,t0+t+.05);g.gain.exponentialRampToValueAtTime(.001,t0+t+2.5);o.start(t0+t);o.stop(t0+t+2.6)})}}catch(_){}

let sleepSnooze=0,alarmIv=null,nightLock=null;
function nightMode(){
 if($('#night'))return;
 const el=document.createElement('div');el.id='night';el.className='nightscr';document.body.appendChild(el);
 const draw=()=>{const n=new Date();el.innerHTML=`${M('s')}<div class="clk">${hm(n)}</div><div class="sub">${S.settings.alarmOn&&alarmDayOk(1)?'Ébresztő: '+esc(S.settings.alarmTime):'Nincs beállított ébresztő'}</div><div class="sub" style="font-size:12px;max-width:260px;text-align:center">Hagyd töltőn, nyitva. Az ébresztő csak nyitott appnál szól.</div><button id="nExit">Kilépés</button>`;$('#nExit').onclick=()=>{clearInterval(el.iv);try{nightLock&&nightLock.release()}catch(_){}el.remove()}};
 draw();el.iv=setInterval(draw,20000);
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>nightLock=l).catch(()=>toast('A képernyő ébren tartását a telefon nem engedi – állíts hosszabb képernyő-kikapcsolást'))}catch(_){}
}
function alarmDayOk(offset){const d=new Date();if(offset)d.setDate(d.getDate()+(hm(d)>=S.settings.alarmTime?1:0));const wd=(d.getDay()+6)%7+1;return (S.settings.alarmDays||[]).includes(wd)}
function mathQ(){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),lv=S.settings.alarmMath||'kozepes';
 if(lv==='konnyu'){const a=r(2,9),b=r(2,9),c=r(5,30);return[`${a} × ${b} + ${c}`,a*b+c]}
 if(lv==='nehez'){const a=r(11,19),b=r(3,9),c=r(6,12),d=r(4,9);return[`${a} × ${b} − ${c} × ${d}`,a*b-c*d]}
 const a=r(2,9),b=r(2,9),c=r(2,9);return[`${a} × ${b} × ${c}`,a*b*c]}
function ringAlarm(test){
 if($('#alarm'))return;const n0=$('#night');if(n0){clearInterval(n0.iv);n0.remove()}
 const el=document.createElement('div');el.id='alarm';el.className='alarmscr';document.body.appendChild(el);
 let q=mathQ(),solved=0;const need=test?1:2;
 const draw=()=>{el.innerHTML=`${M('a')}<div class="clk">${hm(new Date())}</div><div style="font-weight:700;margin-top:6px">Jó reggelt! Kapcsold ki egy fejszámolással (${solved+1}/${need})</div><div class="q">${q[0]} = ?</div><input id="aIn" inputmode="numeric" autocomplete="off"><button id="aGo">Kész</button>`;
  const go=()=>{const v=parseInt($('#aIn').value.replace(/\s/g,''),10);if(v===q[1]){solved++;if(solved>=need){clearInterval(alarmIv);alarmIv=null;el.remove();showMorning();return}toast('Jó! Még egy');q=mathQ();draw()}else{toast('Nem jó – új feladat');q=mathQ();draw()}};
  $('#aGo').onclick=go;$('#aIn').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>{try{$('#aIn').focus()}catch(_){}},100)};
 draw();clearInterval(alarmIv);alarmIv=setInterval(()=>{beep();try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(_){}},1500);beep();
}
function checkDaily(){
 const st=S.settings,t=today();
 if(st.alarmOn&&alarmDayOk()&&inWindow(st.alarmTime,30)&&!shown.has('al'+t)){shown.add('al'+t);ringAlarm();return true}
 if($('#ov')||$('#alarm')||$('#medscr')||appLocked())return true;
 if(checkMeds())return true;
 if(st.morningOn&&inWindow(st.morningTime,180)&&!shown.has('mo'+t)&&!(st.alarmOn&&alarmDayOk()&&inWindow(st.alarmTime,30))){shown.add('mo'+t);showMorning();return true}
 if(st.gratOn&&inWindow(st.gratTime,60)&&!shown.has('gr'+t)){shown.add('gr'+t);showGratitude();return true}
 if(st.sleepOn&&inWindow(st.sleepTime,120)&&!shown.has('sl'+t)&&Date.now()>sleepSnooze&&!$('#night')){shown.add('sl'+t);showSleep();return true}
 if(!$('#night')&&checkBreaks())return true;
 if(!$('#night'))checkKind();
 return false;
}

function confetti(n){n=n||46;const cols=['#ff5ca8','#7b5cff','#ffd23f','#3ccf6e','#4d8dff','#ff8a5c'];for(let i=0;i<n;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
function sparkle(){try{if(!actx)return;const t0=actx.currentTime;[1318.5,1568,2093].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,t0+i*.08);g.gain.linearRampToValueAtTime(.1,t0+i*.08+.01);g.gain.exponentialRampToValueAtTime(.001,t0+i*.08+.4);o.start(t0+i*.08);o.stop(t0+i*.08+.45)})}catch(_){}}

function onMailData(res){
 const th=(res&&res.payload&&res.payload.threads)||[];const seen=mailSeen();let fresh=[];
 const items=th.map(t=>{const m=(t.messages||[])[0]||{};const dn=(m.addressDisplayNames||[]).find(a=>a.emailAddress===m.sender);return{id:m.id||t.id,from:(dn&&dn.displayName)||m.sender||'Ismeretlen',subject:m.subject||'(nincs tárgy)',at:m.date?new Date(m.date):new Date(),url:t.viewUrl||m.viewUrl,seen:false,gmail:true}});
 items.forEach(it=>{if(!seen.has(it.id)){if(!mailFirst)fresh.push(it);seen.add(it.id)}});
 mailSeenSave(seen);mailFirst=false;
 mails=items.concat(mails.filter(m=>!m.gmail));mailBadge();

function dayAllday(k){const d=new Date(k+'T12:00:00'),wd=DAYS[(d.getDay()+6)%7];return celOn(k).map(c=>(c.p.type==='nevnap'?'🌸 ':'🎂 ')+c.p.name+(c.age?' ('+c.age+')':'')).concat(S.tasks.filter(x=>x.due===k&&!x.done).map(x=>'✅ '+x.title).concat(S.schedule.filter(x=>x.day===wd&&!x.start).map(x=>'🔁 '+x.title)).concat(S.reminders.filter(x=>!x.done&&x.when&&x.when.slice(0,10)===k).map(x=>'⏰ '+x.when.slice(11,16)+' '+x.title))).concat((S.cnotes||[]).filter(n=>n.due&&!n.done&&n.due.slice(0,10)===k).map(n=>'⏳ '+n.due.slice(11,16)+' '+n.group+' – '+n.text.split('\n')[0].slice(0,40))).concat(GEV.filter(g=>g.ad&&g.k<=k&&g.ke>=k).map(g=>'📅 '+g.t))}

 evs.forEach(e=>{const s=minsOf(e.start),en=Math.max(minsOf(e.end),s+20);e._s=s;e._e=en;if(cur.length&&s>=end){groups.push(cur);cur=[];end=-1}cur.push(e);end=Math.max(end,en)});if(cur.length)groups.push(cur);
 groups.forEach(g=>{const cols=[];g.forEach(e=>{let c=cols.findIndex(t=>t<=e._s);if(c<0){c=cols.length;cols.push(0)}cols[c]=e._e;e.col=c});g.forEach(e=>{e.ncol=cols.length;e.clash=cols.length>1})});return evs}
function clashesOn(k){return layoutCols(dayEvents(k)).filter(e=>e.clash)}
function hourRange(evs){let a=7,b=19;evs.forEach(e=>{a=Math.min(a,Math.floor(minsOf(e.start)/60));b=Math.max(b,Math.ceil(minsOf(e.end)/60))});return[a,Math.min(24,b)]}

 const now=new Date(),nm=now.getHours()*60+now.getMinutes();const nowl=k===today()&&nm>=a*60&&nm<=b*60?`<div class="nowl" style="top:${P(nm-a*60)}"></div>`:'';

function vHonap(){

function u8b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function saveBinary(filename,u8,okMsg){
 if(NATIVE){const FS=CAP('Filesystem'),SH=CAP('Share');if(!FS){toast('A mentés nem érhető el');return}
  try{const r=await FS.writeFile({path:filename,data:u8b64(u8),directory:'CACHE'});

   const r2=await FS.writeFile({path:filename,data:u8b64(u8),directory:'DOCUMENTS',recursive:true}).catch(()=>null);
   toast(okMsg+(r2?' (Dokumentumok mappa)':''))}catch(e){toast('Mentés nem sikerült')}
  return}

 try{await dl.save({filename,data:u8});toast(okMsg)}catch(e){toast(e&&e.code==='declined'?'Letöltés megszakítva':'Letöltés nem sikerült')}
}

function nameDates(name){name=name.trim().toLowerCase();if(!name)return[];return Object.keys(NEVNAP).filter(md=>NEVNAP[md].split(',').some(n=>n.trim().toLowerCase()===name))}

function nextOcc(md){const t=today(),y=Number(t.slice(0,4));let k=y+'-'+md;if(md==='02-29'&&!(y%4===0&&(y%100!==0||y%400===0)))k=y+'-03-01';if(k<t){const y2=y+1;k=y2+'-'+md;if(md==='02-29'&&!(y2%4===0&&(y2%100!==0||y2%400===0)))k=y2+'-03-01'}return k}
function daysUntil(k){return Math.round((new Date(k+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5)}
function celebrations(maxDays){const out=[];(S.people||[]).forEach(p=>{const md=p.type==='nevnap'?(p.md||nameDates(p.name)[0]):(p.date||'').slice(5);if(!md)return;const k=nextOcc(md),d=daysUntil(k);if(maxDays==null||d<=maxDays){let age=null;if(p.type==='szulinap'&&p.date&&!p.noYear){const y=Number(p.date.slice(0,4));if(y>1900)age=Number(k.slice(0,4))-y}out.push({p,k,d,age})}});return out.sort((a,b)=>a.d-b.d||a.p.name.localeCompare(b.p.name,'hu'))}

  $('#pNo').onclick=closeForm;

  $('#pOk').onclick=()=>{readF();if(!p.name){toast('Írd be a nevet');return}if(p.type==='szulinap'&&!p.date){toast('Add meg a dátumot');return}if(p.type==='nevnap'&&!p.md){const ds=nameDates(p.name.split(/\s+/).pop());if(ds.length)p.md=ds[0];else{toast('Nem találom a névnaptárban – adj meg dátumot kézzel');return}}put('people',p);closeForm();toast('Mentve '+(p.type==='nevnap'?'🌸':'🎂'))};
 };draw();

const wxMem={};
function getWx(lat,lon){const key='szs-wx2-'+lat.toFixed(2)+','+lon.toFixed(2);let c=wxMem[key];if(!c){try{c=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}}
 const fresh=c&&Date.now()-c.at<30*60e3;
 if((NATIVE||!window.claude)&&!fresh&&!wxMem[key+'_l']){wxMem[key+'_l']=1;fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability&forecast_hours=13&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBudapest&forecast_days=4`).then(r=>r.json()).then(j=>{const d={at:Date.now(),j};wxMem[key]=d;try{localStorage.setItem(key,JSON.stringify(d))}catch(_){}render()}).catch(()=>{}).finally(()=>{setTimeout(()=>{delete wxMem[key+'_l']},60e3)})}
 if(c)wxMem[key]=c;return c&&c.j}
function wxScene(name,lat,lon,big){
 const n=new Date(),s=sunTimes(new Date(today()+'T12:00:00'),lat,lon),j=getWx(lat,lon);
 const isDay=n>=s.rise&&n<=s.set,dusk=Math.abs(n-s.set)<45*60e3||Math.abs(n-s.rise)<45*60e3;
 const cur=j&&j.current,code=cur?cur.weather_code:(isDay?0:0),info=WXC[code]||WXC[0],kind=cur?info[2]:'clear';
 const R=(a,b)=>a+Math.random()*(b-a);
 let sc='';
 if(kind==='clear'||kind==='partly'){sc+=isDay?'<div class="sunb"></div>':'<div class="moonb"></div>'}
 if(!isDay)for(let i=0;i<18;i++)sc+=`<i class="star" style="left:${R(2,96)}%;top:${R(4,60)}%;animation-delay:${R(0,2.6)}s"></i>`;
 const nc=kind==='clear'?1:kind==='partly'?3:kind==='fog'?0:5;
 for(let i=0;i<nc;i++)sc+=`<i class="cloud" style="top:${R(8,60)}px;animation-duration:${R(22,40)}s;animation-delay:-${R(0,30)}s;transform:scale(${R(.7,1.2)})"></i>`;
 if(kind==='rain'||kind==='storm')for(let i=0;i<34;i++)sc+=`<i class="drop" style="left:${R(0,104)}%;animation-duration:${R(.6,1)}s;animation-delay:-${R(0,1)}s"></i>`;
 if(kind==='snow')for(let i=0;i<30;i++)sc+=`<i class="flake" style="left:${R(0,100)}%;animation-duration:${R(4,8)}s;animation-delay:-${R(0,8)}s;transform:scale(${R(.5,1.1)})"></i>`;
 if(kind==='storm')sc+='<i class="flash"></i>';
 if(kind==='fog')for(let i=0;i<4;i++)sc+=`<i class="fogb" style="top:${30+i*34}px;animation-delay:-${i*2}s"></i>`;
 const cls=(dusk&&(kind==='clear'||kind==='partly'))?'dusk':isDay?'day':'night';

 return `<div class="wxs ${cls} ${kind==='cloudy'||kind==='rain'||kind==='storm'||kind==='fog'?'grey':''} ${big?'span2':''}"><div class="sc">${sc}</div>
 <div class="pl">📍 ${esc(name)}</div>${cur?`<div class="tmp">${Math.round(cur.temperature_2m)}°</div><div class="dsc">${info[1]} ${info[0]} · szél ${Math.round(cur.wind_speed_10m)} km/h</div>`:`<div class="tmp" style="font-size:40px">${hm(n)}</div><div class="dsc">${isDay?'☀️ Nappal':'🌙 Éjszaka'}${NATIVE?' · időjárás betöltése…':''}</div>`}
 <div class="sr"><span>🌅 ${tFmt(s.rise)}</span><span>🌇 ${tFmt(s.set)}</span>${j&&j.daily?`<span>☔ ${j.daily.precipitation_probability_max[0]}%</span>`:''}</div>
 ${fc?`<div class="fc">${fc}</div>`:(!NATIVE?'<div class="sub" style="color:#fff;opacity:.85;margin-top:8px">Élő hőmérséklet és előrejelzés az Android-appban.</div>':'')}</div>`;

const NUMW={'fél':.5,'egy':1,'egész':1,'két':2,'kettő':2,'három':3,'négy':4,'öt':5,'hat':6,'hét':7,'nyolc':8,'kilenc':9,'tíz':10};
const UNITS=[[/^(kg|kiló)/,'g',1000],[/^(dkg|deka)/,'g',10],[/^(g|gr|gramm)/,'g',1],[/^(ml)/,'ml',1],[/^(cl)/,'ml',10],[/^(dl|deci)/,'ml',100],[/^(l|liter)\b/,'ml',1000],[/^(korsó|üveg)/,'ml',500],[/^(pohár|bögre)/,'ml',250],[/^(csésze)/,'ml',150],[/^(evőkanál|ek)/,'g',15],[/^(teáskanál|kiskanál|tk|kanál)/,'g',5],[/^(db|darab|szelet|adag|tányér|tábla|zacskó|marék|pár|gombóc)/,'db',1]];
function parseFoodPart(t){t=t.trim();if(!t)return null;let s=t.toLowerCase().replace(/,/g,'.');let q=null,unit='db',mult=1;
 let m=s.match(/^(\d+(?:\.\d+)?)\s*/);if(m){q=parseFloat(m[1]);s=s.slice(m[0].length)}else{const w=s.split(/\s+/)[0];if(NUMW[w]!=null){q=NUMW[w];s=s.slice(w.length).trim()}}
 for(const [re,u,f] of UNITS){const mm=s.match(re);if(mm){unit=u;mult=f;s=s.slice(mm[0].length).trim();break}}
 if(q==null)q=1;const lt=t.toLowerCase();let f=null,best=0;FOODS.forEach(x=>{const m=lt.match(x[0]);if(m&&m[0].length>best){best=m[0].length;f=x}});
 const name=t.replace(/^\s*[\d.,]+\s*/,'');
 if(!f)return{text:t,name:name||t,kcal:null,cat:'egyéb',q,unit};
 const grams=unit==='db'?q*f[3]:q*mult;const kcal=Math.round(f[2]*grams/100);
 return{text:t,name:f[1],kcal,cat:f[4],q,unit,grams:Math.round(grams)}}
function parseFood(text){return text.split(/\n|;|\+|,(?!\d)|\bés\b/).map(parseFoodPart).filter(Boolean)}
function foodDay(k){return ((S.food||[]).find(x=>x.id===k)||{items:[]}).items||[]}

function kcalDay(k){return foodDay(k).reduce((a,x)=>a+(Number(x.kcal)||0),0)}

  if(Array.isArray(r))unk.forEach((x,i)=>{const e=r[i];if(e&&typeof e.kcal==='number'){x.kcal=Math.round(e.kcal);x.name=e.nev||x.name;x.cat=e.kategoria||'egyéb';x.est='claude'}})}}catch(_){}}

 const still=items.filter(x=>x.kcal==null);if(still.length)toast('Néhány tételnél add meg kézzel a kalóriát (koppints rá)');else toast(`+${items.reduce((a,x)=>a+x.kcal,0)} kcal`);
}

function weekStats(off){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i-off*7);days.push(ymd(d))}
 const all=days.flatMap(k=>foodDay(k)),cnt=c=>all.filter(x=>x.cat===c).length,logged=days.filter(k=>foodDay(k).length).length;
 const kc=days.map(kcalDay);return{days,kc,logged,avg:logged?Math.round(kc.reduce((a,b)=>a+b,0)/logged):0,all,
  coffee:all.filter(x=>x.cat==='kávé').reduce((a,x)=>a+(x.unit==='db'?x.q:1),0),alcohol:cnt('alkohol'),sweet:cnt('édesség')+cnt('édes ital'),fast:cnt('gyorsétel'),veg:cnt('zöldség')+cnt('gyümölcs'),proc:cnt('felvágott'),snack:cnt('snack'),whole:cnt('gabona-teljes'),fish:cnt('hal')}}
function healthNotes(w,p){const H=S.settings.health||{},n=[];const ar=(a,b)=>a>b?'⬆':a<b?'⬇':'→';
 if(!w.logged){n.push(['amb','Ezen a héten még nincs bejegyzés. Írd be, mit ettél – egy sor is elég.']);return n}
 n.push(['ok',`Átlag ${w.avg} kcal/nap (${w.logged} nap rögzítve) ${p.logged?ar(w.avg,p.avg)+' az előző héthez képest ('+p.avg+')':''}`]);
 if(w.veg>=w.logged*3)n.push(['ok',`🥗 Szép: ${w.veg} adag zöldség/gyümölcs.`]);else n.push(['amb',`🥗 Kevés zöldség/gyümölcs (${w.veg} adag a héten) – napi több adag ajánlott.`]);
 if(w.fast)n.push([w.fast>=3?'red':'amb',`🍔 Gyorsétel: ${w.fast}× ${ar(w.fast,p.fast)}`]);
 if(w.sweet)n.push([w.sweet>=7?'red':'amb',`🍰 Édesség/cukros ital: ${w.sweet}× ${ar(w.sweet,p.sweet)}`]);
 if(w.proc)n.push(['amb',`🥓 Felvágott/kolbász: ${w.proc}× – sok sót és telített zsírt tartalmaz.`]);
 if(w.coffee)n.push(['ok',`☕ Kávé: ${w.coffee} csésze (${(w.coffee/7).toFixed(1)}/nap) ${ar(w.coffee,p.coffee)}`]);
 if(w.alcohol)n.push([w.alcohol>=5?'red':'amb',`🍷 Alkohol: ${w.alcohol}× ${ar(w.alcohol,p.alcohol)}`]);
 if(w.fish)n.push(['ok',`🐟 Hal: ${w.fish}× – jó választás.`]);
 if(w.whole)n.push(['ok',`🌾 Teljes kiőrlésű: ${w.whole}×`]);
 if(H.heart){n.push(['amb','❤️ Szív-érrendszeri előzmény miatt: a só, a telített zsír (felvágott, sajt, gyorsétel, sütemény) és az alkohol mértéke különösen fontos; a hal, zöldség, gyümölcs, teljes kiőrlésű gabona előnyös. Az étrendedet a kardiológusoddal vagy dietetikussal egyeztesd.']);
  if(w.fast+w.proc>=3)n.push(['red','❤️ Ezen a héten több volt a sós-zsíros étel (gyorsétel/felvágott). Érdemes ezt megbeszélni az orvosoddal.'])}
 if(H.bp&&(w.proc+w.fast+w.snack)>=3)n.push(['amb','🩺 Magas vérnyomás mellett a sós ételek (felvágott, chips, gyorsétel) visszafogása ajánlott.']);
 if(H.diab&&w.sweet>=3)n.push(['red','🩸 Cukorbetegség mellett sok volt az édesség/cukros ital – figyelj rá.']);
 if(H.chol&&(w.proc+w.fast)>=2)n.push(['amb','🧈 Magas koleszterin mellett a telített zsír (felvágott, gyorsétel, vaj) mérséklése ajánlott.']);
 return n}

 $('#paX').onclick=onBack;$('#paQ').oninput=e=>{const q=e.target.value.toLowerCase();el.querySelectorAll('[data-pap]').forEach(x=>x.style.display=x.dataset.lb.includes(q)?'':'none')};

 el.querySelectorAll('[data-pap]').forEach(x=>x.onclick=async()=>{const a=L.find(z=>z.pkg===x.dataset.pap);const col=a.icon?await iconColor(a.icon):null;onPick(Object.assign({pkg:a.pkg,sys:'',appLabel:a.label,icon:''},col?{color:col}:{}))})}
function iconColor(src){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.drawImage(im,0,0,24,24);const d=g.getImageData(0,0,24,24).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(mx-mn<25)continue;r+=d[i];gg+=d[i+1];b+=d[i+2];n++}if(!n)return res(null);res('#'+[r,gg,b].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join(''))}catch(_){res(null)}};im.onerror=()=>res(null);im.src=src})}

 if(c.type==='counter'){const lg=c.log||{},tn=lg[today()]||0,days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ymd(d);days.push([k,lg[k]||0])}const mx=Math.max(1,...days.map(d=>d[1])),tot=Object.values(lg).reduce((a,b)=>a+b,0);
