function xPlan(wb){
 const sh=name=>wb.SheetNames.find(s=>s.trim().toLowerCase()===name.toLowerCase());
 const get=name=>{const k=sh(name);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:'',raw:true}):[]};
 const val=(r,h)=>{const k=Object.keys(r).find(x=>x.trim().toLowerCase()===h.toLowerCase());return k?r[k]:''};
 const exp={};let ver='';get('_export').forEach(r=>{const c=String(r.c||''),id=String(r.id||'');if(c==='_v')ver=id;else if(c)(exp[c]=exp[c]||new Set()).add(id)});
 const isExp=Object.keys(exp).length>0,plan=[];
 const hasCol=(name,col)=>{const k=sh(name);if(!k)return false;const r=XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:''})[0]||[];return r.some(x=>String(x).trim().toLowerCase()===col.toLowerCase())};
 for(const sp0 of XS){let sp=sp0;if(sp.need&&![].concat(sp.need).some(nc=>hasCol(sp.sheet,nc))){if(sp.alias&&sh(sp.alias))sp=Object.assign({},sp,{sheet:sp.alias});else continue}if(!sh(sp.sheet))continue;
  const cur=xCur(sp.c),byId=new Map(cur.map(x=>[x.id,x])),byKey=new Map();cur.forEach(x=>{try{byKey.set(sp.key(x),x)}catch(_){}});
  const seen=new Set(),add=[],upd=[];
  for(const r of get(sp.sheet)){const it=xIn(sp,r,val);let ok=false;try{ok=sp.ok(it)}catch(_){}if(!ok)continue;
   const rid=String(val(r,'Azonosító')||'').trim();let ex=(rid&&byId.get(rid))||byKey.get(sp.key(Object.assign({},xDefaults(sp.c),it)));
   if(ex&&seen.has(ex.id))ex=null;
   if(ex){seen.add(ex.id);const m=Object.assign({},ex,it,{id:ex.id});const nz=v=>(v===false||v==null||v===0)?'':String(v);if([...sp.cols.map(c=>c[1]),'md'].some(k=>nz(ex[k])!==nz(m[k])))upd.push(m)}
   else{const nw=Object.assign({id:uid()},xDefaults(sp.c),it);if(sp.c==='gifts'&&!nw.year)nw.year=String(new Date().getFullYear());add.push(nw);seen.add(nw.id);byKey.set(sp.key(nw),nw)}}
  const del=isExp&&exp[sp.c]?cur.filter(x=>exp[sp.c].has(x.id)&&!seen.has(x.id)):[];
  plan.push({sp,add,upd,del,seen})}
 // heti minta → órák
 let L=plan.find(p=>p.sp.c==='lessons');const lsp=XS[0];
 const breaks=get('Szünetek').map(r=>[nDate(val(r,'Ettől')),nDate(val(r,'Eddig'))||nDate(val(r,'Ettől'))]).filter(b=>b[0]);
 const isBreak=k=>breaks.some(([a,b])=>k>=a&&k<=b);const pat=get('Heti minta');
 if(pat.length){if(!L){L={sp:lsp,add:[],upd:[],del:[],seen:new Set()};plan.unshift(L)}
  const cur=allLessons(),byKey=new Map(cur.map(x=>[lsp.key(x),x]));L.add.forEach(x=>byKey.set(lsp.key(x),x));L.upd.forEach(x=>byKey.set(lsp.key(x),x));
  for(const r of pat){const day=DAYS.findIndex(d=>d.toLowerCase()===String(val(r,'Nap')).trim().toLowerCase());const from=nDate(val(r,'Ettől')),to=nDate(val(r,'Eddig'));if(day<0||!from||!to)continue;
   const wk=String(val(r,'Hetek')||'Minden').trim().toLowerCase();const d=new Date(from+'T12:00:00');while((d.getDay()+6)%7!==day)d.setDate(d.getDate()+1);
   for(;ymd(d)<=to;d.setDate(d.getDate()+7)){const k=ymd(d),w=isoWeek(d);if(isBreak(k))continue;if(wk.startsWith('páros')&&w%2)continue;if(wk.startsWith('páratlan')&&!(w%2))continue;
    const vv=(...hs)=>{for(const x of hs){const v=val(r,x);if(v!==''&&v!=null)return v}return ''};const we=[0,6].includes(d.getDay());const kp=String(vv('Technikus/Szakmunkás'));
    const it={date:k,start:nTime(vv('Óra kezdete','Kezdés'))||(we?'09:00':''),end:nTime(vv('Óra vége','Vége'))||(we?'15:30':''),school:String(vv('Iskola')).trim(),group:String(vv('Osztály','Osztály/csoport')).trim(),prof:String(vv('Szakma')).trim(),kepz:/techn/i.test(kp)?'Technikus':/szakm/i.test(kp)?'Szakmunkás':'',subject:String(vv('Tantárgy','Tantárgy/óra')).trim(),room:String(vv('Terem')).trim()};if(it.start&&!it.end)it.end=addMin(it.start,45);
    const ex=byKey.get(lsp.key(it));
    if(ex){if(!L.seen.has(ex.id)){L.seen.add(ex.id);const m=Object.assign({},ex,it);if(['end','subject','room','prof','kepz'].some(q=>(ex[q]||'')!==(m[q]||''))){const i=L.upd.findIndex(u=>u.id===ex.id);if(i>=0)L.upd[i]=m;else if(!L.add.includes(ex))L.upd.push(m)}}}
    else{const nw=Object.assign({id:uid(),note:'',exam:''},it);L.add.push(nw);L.seen.add(nw.id);byKey.set(lsp.key(nw),nw)}}}}
 // órarend-csere (sablonból): a fájl időszakában és iskoláinál a fájlban már nem szereplő régi órák
 let repl=[],rng=null;
 if(L&&!isExp){const fl=[...L.add,...L.upd,...allLessons().filter(x=>L.seen.has(x.id))];
  if(fl.length){const ds=fl.map(x=>x.date).sort(),sc=new Set(fl.map(x=>(x.school||'').toLowerCase()));rng=[ds[0],ds[ds.length-1]];
   repl=allLessons().filter(x=>!L.seen.has(x.id)&&x.date>=rng[0]&&x.date<=rng[1]&&sc.has((x.school||'').toLowerCase()))}}

}
async function xApply(P,replace){
 toast('Betöltés…');
 for(const p of P.plan){if(p.sp.c==='lessons')continue;for(const x of [...p.add,...p.upd])await put(p.sp.c,x);for(const x of p.del)await del(p.sp.c,x.id)}

 if(L){const have=new Set(S.schools.map(s=>s.name.toLowerCase())),PAL=['#7cc8ff','#ffd23f','#ff8fb8','#8ee68a','#c9a7ff','#ffb36b','#5ee0d0'];let i=S.schools.length;for(const x of [...L.add,...L.upd]){const nm=(x.school||'').trim();if(nm&&!have.has(nm.toLowerCase())){have.add(nm.toLowerCase());await put('schools',{id:uid(),name:nm,color:PAL[i++%PAL.length]})}}}

 if(backend!=='db')saveLocal();render();

function nDate(v){if(v instanceof Date)return ymd(v);if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return ymd(new Date(d.getTime()+d.getTimezoneOffset()*6e4))}const s=String(v||'').trim().replace(/\./g,'-').replace(/-$/,'');const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):''}
function nTime(v){if(v instanceof Date)return hm(v);if(typeof v==='number'){const t=Math.round((v%1)*1440);return pad(Math.floor(t/60))+':'+pad(t%60)}const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?pad(m[1])+':'+m[2]:''}
function nDT(v){if(v instanceof Date)return ymd(v)+'T'+hm(v);if(typeof v==='number'){const d=nDate(v),t=nTime(v);return d?d+'T'+(t||'00:00'):''}const d=nDate(v),t=nTime(v);return d?d+'T'+(t||'09:00'):''}
